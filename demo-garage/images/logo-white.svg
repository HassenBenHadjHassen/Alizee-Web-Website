<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <!-- Tire icon -->
  <g transform="translate(30,30)">
    <!-- Outer tire -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ffffff" stroke-width="5"/>
    <!-- Inner rim -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
    <!-- Hub center -->
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <!-- Spokes -->
    <line x1="0" y1="-14" x2="0" y2="-26" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="0" y1="14" x2="0" y2="26" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-14" y1="0" x2="-26" y2="0" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="14" y1="0" x2="26" y2="0" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-10" y1="-10" x2="-18.4" y2="-18.4" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="10" y1="10" x2="18.4" y2="18.4" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="10" y1="-10" x2="18.4" y2="-18.4" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="-10" y1="10" x2="-18.4" y2="18.4" stroke="#ffffff" stroke-width="2.5"/>
  </g>
  <!-- LNC text -->
  <text x="66" y="22" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#ffffff" letter-spacing="3">LNC</text>
  <!-- Separator line -->
  <line x1="66" y1="28" x2="255" y2="28" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  <!-- AUTOS PNEUS text -->
  <text x="67" y="46" font-family="Arial, sans-serif" font-weight="400" font-size="13" fill="#ffffff" letter-spacing="4.5">AUTOS PNEUS</text>
  <!-- Accent dot -->
  <circle cx="250" cy="13" r="3" fill="#e8292b"/>
</svg>
